name: Check model and competitor prices

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    env:
      UPDATE_BRANCH: automated/update-model-prices
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check model prices against official docs
        id: check_models
        run: node scripts/check-model-prices.js

      - name: Check competitor prices against public pricing pages
        id: check_competitors
        run: node scripts/check-competitor-prices.js

      - name: Combine results
        id: combine
        run: |
          if [ "${{ steps.check_models.outputs.changed }}" = "true" ] || [ "${{ steps.check_competitors.outputs.changed }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Uses PRICE_UPDATE_PAT (a personal access token with `contents: write` and
      # `pull-requests: write`) when it is configured. Without it the default
      # GITHUB_TOKEN is used, which can only open pull requests when the repository
      # setting "Allow GitHub Actions to create and approve pull requests" is enabled.
      - name: Create pull request
        id: create_pr
        if: steps.combine.outputs.changed == 'true'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PRICE_UPDATE_PAT || secrets.GITHUB_TOKEN }}
          commit-message: 'Update model and competitor prices'
          title: 'Update model and competitor prices'
          body: |
            This automated PR was opened by the [Check model and competitor prices](../actions/workflows/check-model-prices.yml) workflow.

            It compares the GitHub Copilot / Anthropic per-token prices in `index.html` against the [GitHub Copilot models and pricing docs](https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing), and the third-party competitor seat prices against each vendor's public pricing page, updating any values that have drifted out of sync.

            #### Model prices

            ${{ steps.check_models.outputs.summary }}

            #### Competitor prices

            ${{ steps.check_competitors.outputs.summary }}

            Please review the changes before merging, especially any competitor price updates, since those are matched heuristically against marketing pages rather than a structured data source.
          branch: ${{ env.UPDATE_BRANCH }}
          delete-branch: true
          assignees: beardofedu

      - name: Report pull request status
        if: steps.combine.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          PR_URL: ${{ steps.create_pr.outputs.pull-request-url }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "Pull request #$PR_NUMBER: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### No pull request was opened for the detected price updates"
            echo
            echo "Price updates were detected, but no pull request could be created."
            echo
            echo "This usually means GitHub Actions is not permitted to create pull requests in this repository."
            echo "To fix it, either enable **Settings → Actions → General → Allow GitHub Actions to create and approve pull requests**,"
            echo "or add a \`PRICE_UPDATE_PAT\` repository secret containing a personal access token with \`contents: write\` and \`pull-requests: write\` permissions."
            echo
            echo "If the \`$UPDATE_BRANCH\` branch was pushed, open a pull request from it manually; otherwise check the logs of the previous step for the underlying error."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::No pull request was created; see the job summary and the 'Create pull request' step logs."
